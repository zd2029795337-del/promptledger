name: Bug report
description: Report a reproducible problem in PromptLedger.
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, private prompts, or sensitive model responses. See SECURITY.md for vulnerability reporting."
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, and PromptLedger version or commit.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command and a small, sanitized suite or response fixture when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
