name: Tests and replay example

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tooling
        run: python -m pip install "setuptools>=68"
      - name: Install PromptLedger
        run: python -m pip install --no-build-isolation -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate the sample suite
        run: python -m promptledger validate examples/maintainer-suite.json
      - name: Create a passing replay baseline
        run: python -m promptledger run examples/maintainer-suite.json --provider replay --responses examples/responses.good.json --output reports/baseline
      - name: Verify an unchanged replay against the baseline
        run: python -m promptledger run examples/maintainer-suite.json --provider replay --responses examples/responses.good.json --baseline reports/baseline/report.json --output reports/current
      - name: Upload replay reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-reports-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
